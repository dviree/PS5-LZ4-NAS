name: Build and release LZ4 Compression

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: "Publish a release with this tag (e.g. v1.5.0-nas.1); empty: build only"
        required: false
        default: ""

jobs:
  build:
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      SDK_SHA256: a9cc9929f21b2b2c5d5b309f3bab4997067c45281c0622cf4838b1aecba66fcb
      LLVM_CONFIG: /usr/bin/llvm-config-18
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          persist-credentials: false

      - name: Install build tools
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends clang-18 lld-18 llvm-18-dev make python3 unzip curl binutils file

      - name: Download PS5 payload SDK v0.43
        run: |
          curl --fail --location --retry 3 \
            --output "$RUNNER_TEMP/ps5-payload-sdk.zip" \
            https://github.com/ps5-payload-dev/sdk/releases/download/v0.43/ps5-payload-sdk.zip
          echo "$SDK_SHA256  $RUNNER_TEMP/ps5-payload-sdk.zip" | sha256sum --check
          unzip -q "$RUNNER_TEMP/ps5-payload-sdk.zip" -d "$RUNNER_TEMP/sdk"
          echo "PS5_PAYLOAD_SDK=$RUNNER_TEMP/sdk/ps5-payload-sdk" >> "$GITHUB_ENV"

      - name: Build ELF with firmware 13.60 support
        run: |
          python3 tools/check_sdk_fw1360.py "$PS5_PAYLOAD_SDK"
          if [[ -n "${{ inputs.release_tag }}" ]]; then
            build_version="${{ inputs.release_tag }}"
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            build_version="$GITHUB_REF_NAME"
          else
            build_version="$(git describe --tags --always --dirty)"
          fi
          make -j"$(nproc)" BUILD_VERSION="$build_version"
          file lz4-compression.elf
          readelf -h lz4-compression.elf | grep -Eq 'Class:[[:space:]]+ELF64'
          readelf -h lz4-compression.elf | grep -Eq 'Machine:[[:space:]]+Advanced Micro Devices X86-64'
          sha256sum lz4-compression.elf > SHA256SUMS

      - name: Upload build artifact
        uses: actions/upload-artifact@v4
        with:
          name: lz4-compression-${{ github.sha }}
          path: |
            lz4-compression.elf
            SHA256SUMS

      - name: Publish GitHub release
        if: startsWith(github.ref, 'refs/tags/v') || inputs.release_tag != ''
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ inputs.release_tag || github.ref_name }}
        run: |
          notes="RELEASE_NOTES_${TAG#v}.md"
          if [[ -f "$notes" ]]; then notes_args=(--notes-file "$notes"); else notes_args=(--generate-notes); fi
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release upload "$TAG" lz4-compression.elf SHA256SUMS --clobber
          elif [[ "$GITHUB_REF_TYPE" == tag ]]; then
            gh release create "$TAG" lz4-compression.elf SHA256SUMS \
              --verify-tag "${notes_args[@]}" --title "LZ4 Compression $TAG"
          else
            # Run by hand: the tag is made at the commit that was built.
            gh release create "$TAG" lz4-compression.elf SHA256SUMS --target "$GITHUB_SHA" \
              "${notes_args[@]}" --title "LZ4 Compression $TAG"
          fi

  nas:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false

      - name: Build the NAS (Linux) engine
        run: make -f nas/Makefile -j"$(nproc)"

      - name: Build the NAS Docker image
        run: docker build -t lz4-compression-nas .

      - name: Smoke test the container
        run: |
          docker run -d --name lzc -p 5920:5920 lz4-compression-nas
          for i in $(seq 1 30); do
            curl -sf http://127.0.0.1:5920/api/status && break
            sleep 1
          done
          curl -sf http://127.0.0.1:5920/api/status | grep -q '"ok":true'
          curl -sf http://127.0.0.1:5920/api/lzc/games | grep -q '"ok":true'
          docker rm -f lzc
