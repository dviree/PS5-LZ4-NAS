name: Game reports

# Counts the "Game report" issues into compat/compat.json, which the app and
# the web page read to show how each game runs for other people.
on:
  issues:
    types: [opened, edited, closed, reopened, labeled, unlabeled, deleted]
  workflow_dispatch:
  schedule:
    - cron: '17 4 * * *'

concurrency:
  group: compat
  cancel-in-progress: false

jobs:
  aggregate:
    if: github.event_name != 'issues' || contains(github.event.issue.labels.*.name, 'compat') || github.event.action == 'unlabeled' || github.event.action == 'deleted'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
      issues: read
    steps:
      - uses: actions/checkout@v4
      - name: Count reports
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh issue list --repo "$GITHUB_REPOSITORY" --label compat --state all --limit 5000 \
            --json number,title,body,createdAt,updatedAt,author,labels,state > /tmp/issues.json
          mkdir -p compat
          python3 tools/compat_aggregate.py /tmp/issues.json compat/compat.json
      - name: Commit if changed
        run: |
          if git diff --quiet -I '"updated"' -- compat/compat.json && git ls-files --error-unmatch compat/compat.json >/dev/null 2>&1; then
            echo "No change"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add compat/compat.json
          git commit -m "Update game reports"
          git push
